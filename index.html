    <script>
        window.addEventListener('error', function (e) {
            if (e.filename && (e.filename.includes('chrome-extension://') || e.filename.includes('Grammarly-check.js') || e.filename.includes('Grammarly.js'))) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return;
            }
            if (e.message && (e.message.includes('envOverride') || e.message.includes('tabs:outgoing.message.ready') || e.message.includes('No Listener'))) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
            const reason = e.reason;
            if (reason) {
                const msg = reason.message || String(reason);
                if (msg.includes('tabs:outgoing.message.ready') || msg.includes('envOverride') || msg.includes('No Listener')) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }
        }, true);
    </script>
